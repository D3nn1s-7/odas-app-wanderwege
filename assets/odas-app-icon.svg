<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7"/>
      <stop offset="100%" stop-color="#3d3fa5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <ellipse cx="160" cy="140" rx="180" ry="160" fill="white" fill-opacity="0.07"/>

  <g filter="url(#shadow)">
    <!-- Bergsilhouette: zwei Gipfel -->
    <path d="M76 356
             L182 176
             L232 254
             L268 200
             L436 356
             Z"
          fill="#ffffff" fill-opacity="0.92"/>
    <!-- Schneekappe rechter Gipfel -->
    <path d="M268 200 L300 244 L268 244 L238 244 Z" fill="#ffffff" fill-opacity="0.55"/>

    <!-- Wanderweg: geschwungener Pfad, der auf den Gipfel zufuehrt -->
    <path d="M96 400
             C150 372 150 340 116 320
             C82 300 96 268 140 256
             C184 244 176 212 210 200
             C238 190 246 216 268 200"
          fill="none"
          stroke="#ffffff"
          stroke-width="16"
          stroke-linecap="round"
          stroke-dasharray="2 34"/>
  </g>
</svg>
